<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101b18"><title>نو+آوینه</title>
<style>
:root{color-scheme:dark;--bg:#0d1512;--panel:#17231e;--line:#2b3b33;--text:#f4f1e8;--muted:#aab8ae;--accent:#d9a928}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}
header{padding:24px 18px 18px;background:linear-gradient(145deg,#1d3027,#101a16);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}.mark{width:46px;height:46px;border-radius:15px;background:var(--accent);color:#172018;display:grid;place-items:center;font-size:23px;font-weight:bold}
h1{font-size:21px;margin:0 0 5px}.sub{font-size:12px;color:var(--muted)}
main{max-width:760px;margin:auto;padding:16px}.toolbar{display:flex;gap:8px;margin:4px 0 14px}
input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px;color:var(--text);font:inherit}
button{background:var(--accent);border:0;border-radius:12px;padding:0 16px;color:#172018;font-weight:bold;font:inherit}
.categories{display:flex;gap:8px;overflow:auto;padding:2px 0 14px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:30px;padding:9px 13px;font-size:12px}.chip.active{background:var(--accent);color:#172018;border-color:var(--accent)}
.status{font-size:12px;color:var(--muted);padding:4px 2px 12px}.post{background:var(--panel);border:1px solid var(--line);border-radius:18px;margin-bottom:12px;overflow:hidden}
.postbody{padding:15px}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:11px;margin-bottom:10px}.tag{color:var(--accent)}
h2{font-size:16px;line-height:1.8;margin:0 0 8px}.body{font-size:13px;line-height:2.1;white-space:pre-wrap;color:#e4e9e3;overflow-wrap:anywhere}
.media{display:block;width:100%;max-height:380px;object-fit:cover;background:#080d0b}.source{display:inline-block;color:var(--accent);font-size:12px;text-decoration:none;padding:8px 0}.media-error{padding:14px;color:var(--muted);font-size:12px;text-align:center;background:#101915}.empty{text-align:center;color:var(--muted);padding:38px 12px}
footer{text-align:center;color:#73847a;font-size:11px;padding:20px}
</style></head>
<body>
<header><div class="brand"><div class="mark">ن+</div><div><h1>نو+آوینه</h1><div class="sub">مرکز رسانه نوجوانان تربت‌حیدریه</div></div></div></header>
<main><div class="toolbar"><input id="search" placeholder="جست‌وجو در روایت‌ها..." aria-label="جست‌وجو"><button id="refresh">تازه‌سازی</button></div>
<nav id="categories" class="categories"><button class="chip active" data-category="">همه مطالب</button></nav>
<div id="status" class="status">در حال دریافت تازه‌ترین مطالب…</div><section id="posts"></section></main>
<footer>روایت‌های نو+آوینه · منبع: کانال عمومی ایتا</footer>
<script>
const API="https://noavine-live-sync-2026.noavinetorbat.workers.dev";
let allPosts=[],category="";
const $=s=>document.querySelector(s);
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function mediaMarkup(items=[]){return items.map(m=>{const raw=String(m.url||"");if(!/^https?:\\/\\//i.test(raw))return "";const u=esc(raw);if(m.type==="video")return '<video class="media" controls preload="metadata" playsinline data-media-url="'+u+'" src="'+u+'"></video>';if(m.type==="audio")return '<div class="postbody"><audio controls preload="none" data-media-url="'+u+'" src="'+u+'"></audio></div>';return '<img class="media" loading="lazy" data-media-url="'+u+'" src="'+u+'" alt="رسانه پست">';}).join("");}
function render(){const q=$("#search").value.trim().toLowerCase();const items=allPosts.filter(p=>(!category||p.category===category)&&(!q||((p.title||"")+" "+(p.body||"")).toLowerCase().includes(q)));$("#posts").innerHTML=items.length?items.map(p=>'<article class="post">'+mediaMarkup(p.media)+'<div class="postbody"><div class="meta"><span class="tag">'+esc(p.category||"سایر روایت‌ها")+'</span><span>'+esc(p.published_at||"")+'</span></div><h2>'+esc(p.title||"روایت نو+آوینه")+'</h2><div class="body">'+esc(p.body||"")+'</div>'+(p.source_url?'<p><a class="source" href="'+esc(p.source_url)+'" target="_blank" rel="noopener noreferrer">مشاهده مطلب در ایتا ↗</a></p>':'')+'</div></article>').join(""):'<div class="empty">مطلبی برای نمایش پیدا نشد.</div>';$("#status").textContent=items.length+" مطلب نمایش داده می‌شود";}
function categories(){const cats=[...new Set(allPosts.map(p=>p.category).filter(Boolean))];$("#categories").innerHTML='<button class="chip '+(!category?'active':'')+'" data-category="">همه مطالب</button>'+cats.map(c=>'<button class="chip '+(category===c?'active':'')+'" data-category="'+esc(c)+'">'+esc(c)+'</button>').join("");$("#categories").querySelectorAll("button").forEach(b=>b.onclick=()=>{category=b.dataset.category;categories();render();});}
async function load(){ $("#status").textContent="در حال دریافت مطالب…";try{const r=await fetch(API+"/api/posts?limit=50",{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json();if(!d.ok)throw new Error("پاسخ سرور معتبر نیست");allPosts=d.posts||[];categories();render();}catch(e){$("#status").textContent="ارتباط با سرور برقرار نشد: "+e.message;}}
document.addEventListener("error",e=>{const el=e.target;if(!el.matches("img.media,video.media,audio"))return;const box=document.createElement("div");box.className="media-error";box.textContent="پخش یا بارگذاری این رسانه در دسترس نیست؛ از لینک مطلب در ایتا استفاده کنید.";el.replaceWith(box);},true);
$("#refresh").onclick=load;$("#search").addEventListener("input",render);load();
</script></body></html>
